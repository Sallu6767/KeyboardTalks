[package]
name = "keyboard-talks"
version = "0.1.0"
description = "KeyboardTalks - Mechanical keyboard sounds for every keystroke"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "keyboard_talks_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "keyboard-talks"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

tauri = { version = "2", features = ["tray-icon", "devtools"] }

tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"

rdev = "0.5"

rodio = { version = "0.19", features = ["wav", "mp3"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

tokio = { version = "1", features = ["full"] }

dirs = "5"

uuid = { version = "1", features = ["v4"] }

parking_lot = "0.12"

once_cell = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
